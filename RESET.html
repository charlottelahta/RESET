function planner(){let upcoming=[...data.events].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6),peak=upcoming.filter(e=>e.stress>=4);return `<div class="journey-head"><div class="emoji">📅</div><div><div class="eyebrow">03 · Stress forecast</div><h1>Plan ahead, feel lighter</h1></div></div><div class="hero-soft"><strong style="font-size:18px">Your upcoming workload</strong><p>See busy periods and get rule-based task suggestions from your own calendar.</p><div class="forecast-strip">${Array.from({length:7},(_,i)=>{let d=new Date(TODAY+'T12:00:00');d.setDate(d.getDate()+i);let ds=d.toISOString().slice(0,10),risk=riskLevel(ds);return `<div class="forecast-day ${risk>=4?'hot':''}"><small>${d.toLocaleDateString('en-SG',{weekday:'short'})}</small><strong>${d.getDate()}</strong><small>${risk>=4?'Busy':risk?'Plan':'—'}</small></div>`}).join('')}</div></div><div class="card"><div class="row"><h3>Suggested workload plan</h3><span class="pill">Demo guidance</span></div>${peak.length?`<p>Higher-stress items: <strong>${peak.map(x=>esc(x.title)).join(', ')}</strong>.</p><div class="quiet">Try dividing your next assignment into 25-minute focus blocks, schedule a short break, and avoid planning demanding tasks during your usual late-night risk window.</div>`:`<p>No high-stress events are currently logged. Add deadlines to receive a personalised suggestion.</p>`}<p class="footnote">Suggestions are simple rules, not real-time AI or clinical stress predictions.</p></div>${forecast()}<div class="subnav"><button onclick="go('mind')">Daily stress check-in ↗</button><button onclick="go('settings')">Reminder settings ↗</button></div>${stressChart()}`}
function friendAvatar(f){return `<span class="friend-avatar" aria-hidden="true">${esc(f.avatar||'🙂')}</span>`}
function friendPoints(f){let idx=data.friends.findIndex(x=>x.id===f.id);return data.demoPeerPoints?.[idx]??(f.id===1?85:f.id===2?120:0)}
function openFriend(id){ui.selectedFriend=id;go('friendProfile')}
function openChat(id){ui.selectedFriend=id;ui.socialTab='chats';go('friendChat')}
function selectSocialTab(tab){ui.socialTab=tab;go('league')}
function friendById(id){return data.friends.find(f=>String(f.id)===String(id))}
function socialTabs(){return `<div class="social-tabs"><button class="${ui.socialTab==='friends'?'on':''}" onclick="selectSocialTab('friends')">♡ Your friends</button><button class="${ui.socialTab==='chats'?'on':''}" onclick="selectSocialTab('chats')">💬 Chats <span class="chat-count">${data.friends.length}</span></button></div>`}
function getThread(id){data.chats ||= {};let key=String(id);if(!Array.isArray(data.chats[key]))data.chats[key]=[];return data.chats[key]}
function initialFriendMessage(f){return f.id===1?`Hey ${data.name}! How's your day going? 😊`:f.id===2?`Hi ${data.name}! Are you free for a study break later? 🌷`:`Hey ${data.name}! Nice to connect here 💜`}
function previewFor(f){let t=getThread(f.id);return t.length?t[t.length-1].text:initialFriendMessage(f)}
function league(){let yours=data.coins, peers=data.friends.filter(f=>f.shared).map(f=>({name:f.name,streak:f.streak,points:friendPoints(f),avatar:f.avatar,id:f.id})),rows=[{name:'You',streak:streakDays(),points:yours,avatar:'SELF_PET'},...peers].sort((a,b)=>b.points-a.points);return `<div class="social-head"><div class="eyebrow">04 · Connect & grow</div><h1>Your circle 💜</h1><p>Supportive friendships, shared milestones and everyday conversations.</p></div>${socialTabs()}${ui.socialTab==='chats'?`<div class="social-section-title"><h2>Messages</h2><span class="muted">Tap to open a conversation</span></div><div class="social-list">${data.friends.map(f=>`<button class="social-list-row" onclick="openChat(${f.id})">${friendAvatar(f)}<span class="social-person-text"><strong>${esc(f.name)}</strong><small>${esc(previewFor(f))}</small></span><span class="social-arrow">›</span></button>`).join('')||'<p class="muted">Add a friend to start chatting.</p>'}</div><p class="social-small-note">Demo conversations are stored only in this browser. No messages are sent to real people.</p>`:`<div class="social-overview"><div class="social-overview-pet">${cutePet()}</div><div><span class="muted">Your caring streak</span><strong>${streakDays()} days ✨</strong><small>${data.coins} care points · ${data.petXP} pet XP</small></div><button onclick="go('pet')">Visit pet ↗</button></div><div class="social-section-title"><h2>Your friends</h2><span class="muted">${data.friends.length} connected</span></div><div class="social-list">${data.friends.map(f=>`<button class="social-list-row" onclick="openFriend(${f.id})">${friendAvatar(f)}<span class="social-person-text"><strong>${esc(f.name)}</strong><small>${f.shared?`🔥 ${f.streak} day coping streak`:'Streak kept private'} · ${friendPoints(f)} care points</small></span><span class="social-arrow">›</span></button>`).join('')||'<p class="muted">Your circle starts here.</p>'}</div><div class="social-add"><h3>Invite a friend</h3><div class="social-add-row"><input class="field" id="newFriend" maxlength="35" placeholder="Friend's name" onkeydown="if(event.key==='Enter')addFriend()"><button onclick="addFriend()">Add +</button></div><p class="social-small-note">This adds a fictional friend locally for the presentation.</p></div>${!data.gentleMode?`<div class="social-league"><div class="social-section-title"><h2>Care-points circle ✨</h2><span class="muted">Optional</span></div><p class="social-small-note">Points reward wellbeing activities, not gambling outcomes. No random prizes or wagers.</p>${rows.map((r,i)=>`<div class="social-rank"><span class="rank-number">${i+1}</span><span class="rank-face">${r.avatar==='SELF_PET'?cutePet():esc(r.avatar)}</span><span class="social-person-text"><strong>${esc(r.name)}</strong><small>${r.streak} shared coping days</small></span><strong>${r.points} ✦</strong></div>`).join('')}</div>`:''}<div class="reset-hours-social"><span>🌙 Hall wellbeing nights</span><p>Looking for a no-stakes alternative to late-night gambling?</p><button onclick="go('resetHours')">Explore Reset Hours →</button></div><div class="social-bottom"><button onclick="selectSocialTab('chats')">💬 Open chats</button><button onclick="go('stories')">🌱 Community stories</button></div>`}`}
function friendPetDetails(f){
 const presets=[
  {name:'Pip',theme:'peach',accessory:'🍓 Strawberry bow',level:'Curious'},
  {name:'Bubbles',theme:'lavender',accessory:'🧢 Tiny beanie',level:'Blooming'},
  {name:'Miso',theme:'mint',accessory:'🧣 Cosy scarf',level:'Growing'},
  {name:'Pudding',theme:'sky',accessory:'⭐ Star clip',level:'Curious'}
 ];
 const i=Math.abs(Number(f.id)||0)%presets.length;
 return {...presets[i],xp:Math.max(15,Math.min(240,friendPoints(f)*2)),friend:f.name};
}

 const colorMap={

 sky:{a:'#c4edff',b:'#b7d4ff',ear:'#b0e8f5',outline:'#87c8e9'}
 };
 const c=colorMap[pet.theme];
 const accessory=pet.accessory.includes('bow')?'<path d="M133 63 Q153 37 159 56 Q157 73 136 72 Q158 82 147 95 Q131 98 130 76" fill="#ff87a9" stroke="#ed6d95" stroke-width="2"/><circle cx="134" cy="72" r="6" fill="#ffe5a6"/>':pet.accessory.includes('beanie')?'<path d="M49 74 Q57 28 103 29 Q145 30 153 74Z" fill="#a19cf5"/><rect x="48" y="65" width="107" height="16" rx="8" fill="#7f79d9"/><circle cx="101" cy="28" r="10" fill="#d5caff"/>':pet.accessory.includes('scarf')?'<path d="M63 154 Q100 172 140 154 L140 167 Q104 183 63 168Z" fill="#ffb2a6"/><path d="M126 164 L140 190 L128 190 L113 169" fill="#ffb2a6"/>':'<path d="M138 64 L142 75 L154 75 L145 83 L148 94 L138 87 L128 94 L131 83 L122 75 L134 75Z" fill="#ffca74"/>';
 return `<svg viewBox="0 0 200 200" class="friend-pet-art" role="img" aria-label="${esc(pet.name)}, ${esc(f.name)}'s ${pet.theme} virtual pet"><defs><linearGradient id="friendpet${Number(f.id)||0}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${c.a}"/><stop offset="1" stop-color="${c.b}"/></linearGradient></defs><ellipse cx="100" cy="178" rx="53" ry="9" fill="#a9a6c8" opacity=".15"/><path d="M57 68 L48 29 Q76 33 85 62 M115 62 Q135 33 152 29 L143 68" fill="${c.ear}" stroke="${c.outline}" stroke-width="4" stroke-linejoin="round"/><path d="M50 99 Q49 51 99 49 Q150 49 151 99 L151 135 Q151 169 100 171 Q49 169 49 135Z" fill="url(#friendpet${Number(f.id)||0})"/><ellipse cx="100" cy="113" rx="48" ry="48" fill="#fffdfd"/><ellipse cx="81" cy="109" rx="5.5" ry="7.5" fill="#2d3047"/><ellipse cx="119" cy="109" rx="5.5" ry="7.5" fill="#2d3047"/><circle cx="83" cy="107" r="1.8" fill="white"/><circle cx="121" cy="107" r="1.8" fill="white"/><ellipse cx="68" cy="125" rx="10" ry="6" fill="#ffadc5" opacity=".8"/><ellipse cx="132" cy="125" rx="10" ry="6" fill="#ffadc5" opacity=".8"/><path d="M91 126 Q100 136 109 126" stroke="#2d3047" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="65" cy="151" rx="15" ry="10" fill="${c.a}"/><ellipse cx="135" cy="151" rx="15" ry="10" fill="${c.a}"/>${accessory}</svg>`;
}
function friendPetCard(f){
 const pet=friendPetDetails(f);
 const progress=Math.round((pet.xp%100));
 return `<section class="friend-pet-card"><div class="friend-pet-heading"><div><span class="friend-pet-eyebrow">🐾 ${esc(f.name.toUpperCase())}'S COMPANION</span><h2>Meet ${pet.name}!</h2><p>A little friend growing with every caring step.</p></div><span class="friend-pet-badge">${pet.level} ✨</span></div><div class="friend-pet-stage">${friendPetArt(f)}<span class="friend-pet-sparkle">✦</span></div><div class="friend-pet-stats"><div><strong>${pet.name}</strong><small>${pet.theme.charAt(0).toUpperCase()+pet.theme.slice(1)} companion</small></div><div><strong>${pet.xp} XP</strong><small>Demo pet progress</small></div></div><div class="friend-pet-progress"><div style="width:${progress}%"></div></div><div class="friend-pet-accessory">🎀 Wearing: <strong>${pet.accessory}</strong></div><p class="friend-pet-footnote">Illustrative pet and accessories · not live friend data</p></section>`;
}
function friendProfile(){let f=friendById(ui.selectedFriend);if(!f)return `<h2>Friend not found</h2>${btn('Back to friends',"go('league')")}`;return `<div class="social-back"><button onclick="go('league')">‹ Friends</button></div><div class="profile-hero"><div class="profile-avatar">${esc(f.avatar)}</div><h1>${esc(f.name)}</h1><p>Part of your supportive circle 🌷</p><div class="profile-metrics"><div><strong>${f.shared?f.streak+' days':'Private'}</strong><small>Coping streak</small></div><div><strong>${friendPoints(f)} ✦</strong><small>Care points</small></div></div><button class="profile-chat-btn" onclick="openChat(${f.id})">💬 Message ${esc(f.name)}</button></div>${friendPetCard(f)}<div class="profile-info"><h3>Growing together</h3><p>${f.shared?`${esc(f.name)} has chosen to share their coping streak. Everyone's progress looks different, and there is no pressure to keep up.`:`${esc(f.name)} keeps their streak private. That's completely okay.`}</p><button onclick="toggleFriend(${f.id})">${f.shared?'Hide demo streak':'Show demo streak'} · privacy</button></div><div class="profile-info"><h3>Friendship settings</h3><p>Manage this fictional connection in your local prototype.</p><button class="remove-friend" onclick="removeFriend(${f.id});go('league')">Remove friend</button></div>`}
function friendChat(){let f=friendById(ui.selectedFriend);if(!f)return `<h2>Friend not found</h2>${btn('Back to chats',"selectSocialTab('chats')")}`;let msgs=getThread(f.id);return `<div class="chat-screen"><div class="chat-top"><button class="chat-back" onclick="selectSocialTab('chats')" aria-label="Back to chats">‹</button><button class="chat-person" onclick="openFriend(${f.id})">${friendAvatar(f)}<span><strong>${esc(f.name)}</strong><small>View profile & shared streak ›</small></span></button></div><div class="chat-conversation" id="chatConversation"><div class="chat-date">Today · Demo conversation</div><div class="chat-message incoming">${esc(initialFriendMessage(f))}</div>${msgs.map(m=>`<div class="chat-message ${m.from==='me'?'outgoing':'incoming'}">${esc(m.text)}</div>`).join('')}</div><form class="chat-input-bar" onsubmit="event.preventDefault();sendChatMessage()"><input class="field" id="chatInput" maxlength="400" placeholder="Message ${esc(f.name)}…" autocomplete="off" aria-label="Message ${esc(f.name)}"><button type="submit" aria-label="Send message">➤</button></form><p class="social-small-note chat-privacy">Fictional replies for the prototype · not live messaging</p></div>`}
const friendReplySets={
 exam:["Oof, exam season again 😭 What module are you revising?","That sounds tiring. Want to grab a quick snack before we study?","You’ve been working hard. We can take it one chapter at a time.","I’m around if you want some company while revising!"],
 urge:["Thanks for telling me 💜 Want to chat for a bit?","Hey, you don’t have to sit with that feeling alone. Want to go for a walk?","I’m here. Would a quick break away from your phone help?","Want me to stay and chat while the urge passes?"],
 walk:["Yes! I could use some fresh air too 🌿","Sounds good, hall lobby in ten?","I’m up for that. Let’s take a break together.","Sure! A short walk would be nice."],
 setback:["Hey, thanks for trusting me enough to say that 💜","I'm still here, okay? Want to talk about how you're feeling?","That sounds rough. We can figure out the next small step together.","One tough day doesn't change how I see you."],
 tired:["Same honestly 😭 Long day?","Maybe call it an early night? Tomorrow can wait a little.","You've done enough for today. Want to just chill?","Do you want to vent or would you rather be distracted?"],
 food:["Food sounds amazing right now 😋","Yes please, where were you thinking?","I’m down! Something affordable near hall?","Can! Let's grab something after class."],
 greeting:["Heyyy! 😊","Hii, what’s up?","Hello hello 💜 How’s your day?","Hey Alex! What's going on?"],
 thanks:["Of course! 💜","Anytime, seriously.","No worries at all 😊","You’d do the same for me!"],
 default:["Ohh tell me more 👀","Haha I get what you mean 😄","I hear you. What happened next?","Aww, I’m here 💜","That makes sense!","What do you feel like doing now?","We should catch up properly soon!","I’m listening 😊"]};
function friendReplyFor(t,f,n){let x=String(t).toLowerCase();let key=/gambl|bet|urge|tempt|casino/.test(x)?'urge':/setback|relaps|lost money|slipped/.test(x)?'setback':/exam|midterm|stud|assignment|deadline|revision|stress/.test(x)?'exam':/walk|stroll|outside|break/.test(x)?'walk':/tired|sleep|burnout|exhaust|sad|down/.test(x)?'tired':/food|eat|dinner|lunch|supper|hungry/.test(x)?'food':/^(hi|hey|hello|yo|sup|hii)[!?. ]*$/.test(x)?'greeting':/thank|appreciate/.test(x)?'thanks':'default';let choices=friendReplySets[key];let hash=[...x].reduce((a,c)=>a+c.charCodeAt(0),0);return choices[(hash+n+(f.id%7))%choices.length]}
function sendChatMessage(){let el=$('#chatInput');if(!el||!el.value.trim())return;let f=friendById(ui.selectedFriend);if(!f)return;let x=el.value.trim(),thread=getThread(f.id);thread.push({from:'me',text:x,date:TODAY});thread.push({from:'friend',text:friendReplyFor(x,f,thread.length),date:TODAY});save();render();let pane=$('#chatConversation');if(pane)pane.scrollTop=pane.scrollHeight;let input=$('#chatInput');if(input)input.focus()}
function savings(){let total=totalSpend(),wish=data.wish[0],saved=data.wish.reduce((n,w)=>n+w.saved,0),goal=data.wish.reduce((n,w)=>n+w.cost,0),pct=goal?Math.min(100,saved/goal*100):0;return `<div class="journey-head"><div class="emoji">💰</div><div><div class="eyebrow">05 · Financial wellbeing</div><h1>Save for what matters</h1></div></div><div class="hero-soft"><div class="row"><div><div class="muted">Money actually set aside</div><div class="heroNumber">${fmt(saved)}</div><p>Across your wishlist goals</p></div><span style="font-size:52px">🎯</span></div><div class="tinybar"><span style="width:${pct}%"></span></div><p class="tiny">${Math.round(pct)}% of your wishlist target saved · based on manual entries</p></div><div class="grid2"><div class="stat"><div class="muted">Recorded gambling spending</div><div class="big">${fmt(total)}</div></div><div class="stat" style="background:#e9defb"><div class="muted">Estimated money protected</div><div class="big">${fmt(data.savedByChoice)}</div></div></div><div class="card"><h3>Estimate a gambling-free choice</h3><p>Enter what you <em>might otherwise have spent</em> to explore potential savings. This is hypothetical, not verified money saved.</p><input class="field" id="avoidedAmount" type="number" min="0" step="0.01" placeholder="Example: S$10"><button class="btn secondary" onclick="addProtected()">Add estimated amount</button></div><div class="card"><h3>Wishlist progress</h3><div class="summary-donut" style="--angle:${pct}%"><div><strong>${Math.round(pct)}%</strong><small>of goal saved</small></div></div>${data.wish.map(w=>`<div class="day"><div style="flex:1"><strong>${esc(w.title)}</strong><div class="muted">${fmt(w.saved)} of ${fmt(w.cost)}</div></div><button class="chip" onclick="saveToWish(${w.id})">＋ Save</button></div>`).join('')}</div>${btn('Open full spending log & wishlist',"go('money')",'secondary')}<div class="footnote">RESET cannot know how much Alex would have gambled. Estimated avoided spending and actual saved funds must remain separate. Essential expenses take priority over wishlist purchases.</div>`}
function addProtected(){let n=Number($('#avoidedAmount').value);if(!Number.isFinite(n)||n<=0||n>100000){alert('Enter a positive estimate.');return}data.savedByChoice+=n;saveAndRender()}


function cutePet(){let stage=data.petXP>=120?3:data.petXP>=60?2:data.petXP>=25?1:0;let ears=stage>=2?'#9ce7f0':'#8de2d8';return `<svg class="pet-art" viewBox="0 0 200 200" role="img" aria-label="Cute pastel RESET companion"><defs><linearGradient id="petg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4f5e9"/><stop offset="1" stop-color="#a9b9ff"/></linearGradient></defs><ellipse cx="100" cy="176" rx="54" ry="10" fill="#d6d8f0" opacity=".6"/><path d="M57 68 L48 29 Q76 33 85 62 M115 62 Q135 33 152 29 L143 68" fill="${ears}" stroke="#6ed9d0" stroke-width="4" stroke-linejoin="round"/><path d="M50 99 Q49 51 99 49 Q150 49 151 99 L151 135 Q151 169 100 171 Q49 169 49 135Z" fill="url(#petg)"/><ellipse cx="100" cy="113" rx="48" ry="48" fill="#fffdfd"/><ellipse cx="81" cy="109" rx="5.5" ry="7.5" fill="#2d3047"/><ellipse cx="119" cy="109" rx="5.5" ry="7.5" fill="#2d3047"/><circle cx="83" cy="107" r="1.8" fill="white"/><circle cx="121" cy="107" r="1.8" fill="white"/><ellipse cx="68" cy="125" rx="10" ry="6" fill="#ffadc5" opacity=".8"/><ellipse cx="132" cy="125" rx="10" ry="6" fill="#ffadc5" opacity=".8"/><path d="M91 126 Q100 136 109 126" stroke="#2d3047" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M93 125 Q100 120 107 125" fill="#ff92ae"/><ellipse cx="65" cy="151" rx="15" ry="10" fill="#9de5e4"/><ellipse cx="135" cy="151" rx="15" ry="10" fill="#9de5e4"/>${stage>=3?'<path d="M100 44 L92 31 L108 31Z" fill="#ffc86b"/>':''}</svg>`}
function buddyReply(t){let x=String(t).toLowerCase();if(/urge|gambl|bet/.test(x))return 'Thank you for telling me. Want to try your RESET breathing exercise, or should we chat for a few minutes?';if(/exam|midterm|stud|overwhelm|stress/.test(x))return 'That sounds like a lot. We can break the next task into one small step. Would a 10-minute break help first?';if(/walk|break/.test(x))return 'A short walk sounds good. We can check in afterwards. You do not have to manage everything alone.';if(/setback|relaps|lost/.test(x))return 'Thanks for being open. One setback does not erase your progress. Are you safe, and would you like help finding professional support?';if(/encourag|tired|sad/.test(x))return 'I’m glad you reached out. Small choices count. Would you like to pick one manageable thing for tonight?';if(/tomorrow|plan/.test(x))return 'Let’s pick one priority, one break and a bedtime target. We can keep it realistic.';return 'I hear you. Would you like to tell me more, take a short break, or check your coping plan?'}

render();
</script></body></html>
